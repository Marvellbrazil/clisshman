[package]
name = "clisshman"
version = "0.1.0"
edition = "2021"
authors = ["Marvell"]
description = "Manage SSH sessions and foreground tunnels from a CLI or terminal UI"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
fs2 = "0.4"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7.1"
crossterm = "0.27"
ratatui = "0.26"
inquire = "0.7"
tempfile = "3.10"
